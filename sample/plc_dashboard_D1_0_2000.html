<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLC Dashboard - D1 Vibrofeeder (0-2000)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #1a1a2e, #2d3561);
        color: #eee;
        padding: 20px;
        min-height: 100vh;
      }
      .container {
        max-width: 1600px;
        margin: 0 auto;
      }

      .header {
        background: linear-gradient(135deg, #0f3460, #16213e);
        padding: 25px;
        border-radius: 15px;
        margin-bottom: 25px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      }
      .header h1 {
        color: #00d9ff;
        font-size: 2.2em;
        margin-bottom: 15px;
      }
      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
      }
      .status-item {
        background: rgba(255, 255, 255, 0.1);
        padding: 12px 25px;
        border-radius: 8px;
      }
      .status-connected {
        background: #4caf50;
        color: white;
        font-weight: bold;
      }
      .status-disconnected {
        background: #f44336;
        color: white;
        font-weight: bold;
      }

      .mode-panel {
        background: linear-gradient(135deg, #2d3561, #1f2647);
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 25px;
        border: 3px solid #ff9800;
      }
      .mode-panel h3 {
        color: #ff9800;
        font-size: 1.5em;
        margin-bottom: 20px;
      }
      .mode-status {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-bottom: 20px;
      }
      .mode-item {
        background: rgba(255, 255, 255, 0.1);
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        border: 2px solid transparent;
      }
      .mode-active {
        background: rgba(76, 175, 80, 0.3);
        border-color: #4caf50;
        box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
      }
      .mode-label {
        font-size: 0.9em;
        color: #aaa;
        margin-bottom: 10px;
      }
      .mode-value {
        font-size: 1.8em;
        font-weight: bold;
      }
      .mode-value-on {
        color: #4caf50;
      }
      .mode-value-off {
        color: #f44336;
      }

      .mode-info {
        background: rgba(0, 217, 255, 0.1);
        padding: 15px;
        border-radius: 8px;
        margin-top: 15px;
        text-align: center;
        font-size: 1.1em;
      }

      .control-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 25px;
        margin-bottom: 25px;
      }

      .panel {
        background: linear-gradient(135deg, #2d3561, #1f2647);
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        border: 3px solid #00d9ff;
      }
      .panel-disabled {
        opacity: 0.5;
        border-color: #666;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
      }
      .panel-title {
        font-size: 2em;
        font-weight: bold;
        color: #00d9ff;
      }
      .panel-status {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1.3em;
      }
      .status-on {
        background: radial-gradient(circle, #4caf50, #2e7d32);
        color: white;
        animation: pulse 2s infinite;
      }
      .status-off {
        background: radial-gradient(circle, #666, #444);
        color: #ccc;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }

      .info-box {
        background: rgba(0, 217, 255, 0.15);
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
        line-height: 1.8;
      }
      .info-box strong {
        color: #00d9ff;
      }

      .d1-control {
        background: rgba(255, 152, 0, 0.1);
        border: 2px solid #ff9800;
        padding: 25px;
        border-radius: 10px;
        margin-bottom: 20px;
      }
      .d1-label {
        font-size: 1.3em;
        color: #ff9800;
        font-weight: bold;
        margin-bottom: 15px;
        text-align: center;
      }
      .d1-value-display {
        font-size: 2.5em;
        color: #4caf50;
        font-weight: bold;
        text-align: center;
        margin: 20px 0;
        padding: 20px;
        background: rgba(76, 175, 80, 0.1);
        border-radius: 10px;
        border: 2px solid #4caf50;
      }

      .slider-container {
        margin: 25px 0;
      }
      .slider-labels {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 0.9em;
        color: #aaa;
      }
      .slider {
        width: 100%;
        height: 20px;
        border-radius: 10px;
        background: linear-gradient(to right, #2e7d32, #ff9800, #f44336);
        outline: none;
        -webkit-appearance: none;
      }
      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        background: #00d9ff;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(0, 217, 255, 0.8);
      }
      .slider:disabled::-webkit-slider-thumb {
        background: #666;
        cursor: not-allowed;
      }

      .d1-input-group {
        display: flex;
        gap: 15px;
        align-items: center;
        margin-top: 20px;
      }
      .d1-input {
        flex: 1;
        padding: 20px;
        font-size: 2em;
        text-align: center;
        border: 3px solid #ff9800;
        border-radius: 10px;
        background: #1f2647;
        color: #00d9ff;
        font-weight: bold;
      }
      .d1-input:disabled {
        background: #333;
        color: #666;
        border-color: #666;
      }
      .d1-input:focus {
        outline: none;
        border-color: #00d9ff;
        box-shadow: 0 0 15px rgba(0, 217, 255, 0.5);
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }
      .btn {
        padding: 18px;
        border: none;
        border-radius: 10px;
        font-size: 1.2em;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        text-transform: uppercase;
      }
      .btn:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      }
      .btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .btn-on {
        background: linear-gradient(135deg, #4caf50, #45a049);
        color: white;
      }
      .btn-off {
        background: linear-gradient(135deg, #f44336, #da190b);
        color: white;
      }
      .btn-set {
        background: linear-gradient(135deg, #ff9800, #f57c00);
        color: white;
        padding: 20px;
        font-size: 1.3em;
        box-shadow: 0 4px 15px rgba(255, 152, 0, 0.5);
      }
      .btn-set:hover:not(:disabled) {
        box-shadow: 0 6px 25px rgba(255, 152, 0, 0.8);
      }

      .quick-values {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        margin-top: 20px;
      }
      .quick-btn {
        padding: 12px;
        background: rgba(0, 217, 255, 0.2);
        border: 2px solid #00d9ff;
        border-radius: 8px;
        color: #00d9ff;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
      }
      .quick-btn:hover:not(:disabled) {
        background: rgba(0, 217, 255, 0.4);
        transform: scale(1.05);
      }
      .quick-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .refresh-btn {
        background: linear-gradient(135deg, #00d9ff, #00b8d9);
        color: #000;
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
      }
      .timestamp {
        text-align: center;
        color: #888;
        margin-top: 25px;
      }

      @media (max-width: 768px) {
        .control-grid,
        .mode-status {
          grid-template-columns: 1fr;
        }
        .quick-values {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🏭 PLC Control - Vibrofeeder D1 (0-2000)</h1>
        <div class="status-bar">
          <div id="connectionStatus" class="status-item status-disconnected">
            ⚠️ Connecting...
          </div>
          <div class="status-item">
            Last Update: <span id="lastUpdate">-</span>
          </div>
          <button class="refresh-btn" onclick="loadStatus()">🔄 Refresh</button>
        </div>
      </div>

      <div class="mode-panel">
        <h3>⚙️ Operation Mode</h3>
        <div class="mode-status">
          <div id="remoteModePanel" class="mode-item">
            <div class="mode-label">REMOTE MODE (X1/M1)</div>
            <div id="remoteModeValue" class="mode-value mode-value-off">-</div>
          </div>
          <div id="autoModePanel" class="mode-item">
            <div class="mode-label">AUTO MODE (X2/M2)</div>
            <div id="autoModeValue" class="mode-value mode-value-off">-</div>
          </div>
          <div id="manualModePanel" class="mode-item">
            <div class="mode-label">MANUAL MODE (M3)</div>
            <div id="manualModeValue" class="mode-value mode-value-off">-</div>
          </div>
        </div>
        <div class="mode-info" id="modeInfo">
          <strong id="currentModeText">-</strong>
        </div>
      </div>

      <div class="control-grid">
        <div id="vibroPanel" class="panel">
          <div class="panel-header">
            <div class="panel-title">Vibrofeeder</div>
            <div id="vibroStatus" class="panel-status status-off">OFF</div>
          </div>

          <div class="d1-control">
            <div class="d1-label">📊 D1 - Grams/Tonne Control</div>
            <div class="d1-value-display" id="d1Display">0</div>

            <div class="slider-container">
              <div class="slider-labels">
                <span>0</span>
                <span>500</span>
                <span>1000</span>
                <span>1500</span>
                <span>2000</span>
              </div>
              <input
                type="range"
                min="0"
                max="2000"
                value="0"
                step="10"
                class="slider"
                id="d1Slider"
                disabled
              />
            </div>

            <div class="d1-input-group">
              <input
                type="number"
                id="d1Input"
                class="d1-input"
                min="0"
                max="2000"
                value="0"
                placeholder="0-2000"
                disabled
              />
              <button
                id="d1SetBtn"
                class="btn btn-set"
                onclick="setD1Value()"
                disabled
              >
                ✓ SET D1
              </button>
            </div>

            <div class="quick-values">
              <button
                class="quick-btn"
                onclick="quickSetD1(0)"
                disabled
                id="quick0"
              >
                0
              </button>
              <button
                class="quick-btn"
                onclick="quickSetD1(500)"
                disabled
                id="quick500"
              >
                500
              </button>
              <button
                class="quick-btn"
                onclick="quickSetD1(1000)"
                disabled
                id="quick1000"
              >
                1000
              </button>
              <button
                class="quick-btn"
                onclick="quickSetD1(1500)"
                disabled
                id="quick1500"
              >
                1500
              </button>
              <button
                class="quick-btn"
                onclick="quickSetD1(2000)"
                disabled
                id="quick2000"
              >
                2000
              </button>
            </div>
          </div>

          <div class="info-box">
            <strong>Y1 Output:</strong>
            <span id="vibroY" style="font-weight: bold">-</span><br />
            <strong>M4 Status:</strong> <span id="vibroM4">-</span>
          </div>

          <div class="controls">
            <button
              id="vibroOnBtn"
              class="btn btn-on"
              onclick="controlVibro(true)"
              disabled
            >
              ⚡ START
            </button>
            <button
              id="vibroOffBtn"
              class="btn btn-off"
              onclick="controlVibro(false)"
              disabled
            >
              🛑 STOP
            </button>
          </div>
        </div>

        <div id="blowerPanel" class="panel">
          <div class="panel-header">
            <div class="panel-title">Blower</div>
            <div id="blowerStatus" class="panel-status status-off">OFF</div>
          </div>

          <div class="info-box">
            <strong>Y0 Output:</strong>
            <span id="blowerY" style="font-weight: bold">-</span><br />
            <strong>M7 Status:</strong> <span id="blowerM7">-</span>
          </div>

          <div class="controls">
            <button
              id="blowerOnBtn"
              class="btn btn-on"
              onclick="controlBlower(true)"
              disabled
            >
              ⚡ START
            </button>
            <button
              id="blowerOffBtn"
              class="btn btn-off"
              onclick="controlBlower(false)"
              disabled
            >
              🛑 STOP
            </button>
          </div>
        </div>
      </div>

      <div class="timestamp" id="timestamp"></div>
    </div>

    <script>
      const API_BASE =
        "https://unboiled-wearying-ramonita.ngrok-free.dev" + "/api";
      let autoRefresh = null;
      let currentMode = "UNKNOWN";

      window.onload = function () {
        loadStatus();
        autoRefresh = setInterval(loadStatus, 2000);

        document
          .getElementById("d1Slider")
          .addEventListener("input", function () {
            document.getElementById("d1Input").value = this.value;
            document.getElementById("d1Display").textContent = this.value;
          });
        document
          .getElementById("d1Input")
          .addEventListener("input", function () {
            const val = Math.min(2000, Math.max(0, this.value));
            document.getElementById("d1Slider").value = val;
            document.getElementById("d1Display").textContent = val;
          });
      };

      async function loadStatus() {
        try {
          const res = await fetch(`${API_BASE}/status`, {
            headers: {
              'ngrok-skip-browser-warning': 'true'
            }
          });
          if (!res.ok) throw new Error("Failed to fetch");

          const data = await res.json();

          const connEl = document.getElementById("connectionStatus");
          connEl.className =
            "status-item " +
            (data.connected ? "status-connected" : "status-disconnected");
          connEl.textContent = data.connected
            ? "✅ Connected"
            : "❌ Disconnected";

          determineMode(data.x_inputs, data.m_coils);
          updateD1Display(data.d_registers.D1 || 0);
          updateBlower(data.y_outputs.Y0, data.m_coils.M7);
          updateVibro(data.y_outputs.Y1, data.m_coils.M4);

          const now = new Date();
          document.getElementById("lastUpdate").textContent =
            now.toLocaleTimeString();
          document.getElementById(
            "timestamp"
          ).textContent = `Last updated: ${now.toLocaleString()}`;
        } catch (error) {
          console.error("Error:", error);
        }
      }

      function determineMode(xInputs, mCoils) {
        const x1 = xInputs.X1 || false;
        const x2 = xInputs.X2 || false;
        const m1 = mCoils.M1 || false;
        const m2 = mCoils.M2 || false;
        const m3 = mCoils.M3 || false;

        let mode = "UNKNOWN";
        if (x1 || m1) {
          mode = "REMOTE";
        } else if (x2 || m2) {
          mode = "AUTO";
        } else if (m3) {
          mode = "MANUAL";
        }

        currentMode = mode;

        document.getElementById("remoteModeValue").textContent =
          x1 || m1 ? "ACTIVE" : "INACTIVE";
        document.getElementById("remoteModeValue").className =
          "mode-value " + (x1 || m1 ? "mode-value-on" : "mode-value-off");
        document.getElementById("remoteModePanel").className =
          "mode-item " + (x1 || m1 ? "mode-active" : "");

        document.getElementById("autoModeValue").textContent =
          x2 || m2 ? "ACTIVE" : "INACTIVE";
        document.getElementById("autoModeValue").className =
          "mode-value " + (x2 || m2 ? "mode-value-on" : "mode-value-off");
        document.getElementById("autoModePanel").className =
          "mode-item " + (x2 || m2 ? "mode-active" : "");

        document.getElementById("manualModeValue").textContent = m3
          ? "ACTIVE"
          : "INACTIVE";
        document.getElementById("manualModeValue").className =
          "mode-value " + (m3 ? "mode-value-on" : "mode-value-off");
        document.getElementById("manualModePanel").className =
          "mode-item " + (m3 ? "mode-active" : "");

        const modeText = document.getElementById("currentModeText");
        const modeInfo = document.getElementById("modeInfo");

        if (mode === "REMOTE") {
          modeText.textContent = "🟢 REMOTE MODE - Dashboard control ENABLED";
          modeText.style.color = "#4caf50";
          modeInfo.style.borderColor = "#4caf50";
          enableControls(true);
        } else if (mode === "AUTO") {
          modeText.textContent = "🟡 AUTO MODE - Dashboard READ ONLY";
          modeText.style.color = "#ff9800";
          modeInfo.style.borderColor = "#ff9800";
          enableControls(false);
        } else if (mode === "MANUAL") {
          modeText.textContent = "🔴 MANUAL MODE - Dashboard DISABLED";
          modeText.style.color = "#f44336";
          modeInfo.style.borderColor = "#f44336";
          enableControls(false);
        } else {
          modeText.textContent = "⚪ MODE UNKNOWN";
          modeText.style.color = "#888";
          enableControls(false);
        }
      }

      function enableControls(enable) {
        document.getElementById("d1Input").disabled = !enable;
        document.getElementById("d1Slider").disabled = !enable;
        document.getElementById("d1SetBtn").disabled = !enable;
        document.getElementById("quick0").disabled = !enable;
        document.getElementById("quick500").disabled = !enable;
        document.getElementById("quick1000").disabled = !enable;
        document.getElementById("quick1500").disabled = !enable;
        document.getElementById("quick2000").disabled = !enable;

        document.getElementById("vibroOnBtn").disabled = !enable;
        document.getElementById("vibroOffBtn").disabled = !enable;
        document.getElementById("vibroPanel").className =
          "panel" + (enable ? "" : " panel-disabled");

        document.getElementById("blowerOnBtn").disabled = !enable;
        document.getElementById("blowerOffBtn").disabled = !enable;
        document.getElementById("blowerPanel").className =
          "panel" + (enable ? "" : " panel-disabled");
      }

      function updateD1Display(value) {
        document.getElementById("d1Display").textContent = value;
        if (
          currentMode !== "REMOTE" ||
          !document.getElementById("d1Input").value
        ) {
          document.getElementById("d1Input").value = value;
          document.getElementById("d1Slider").value = value;
        }
      }

      function updateBlower(yState, m7State) {
        const statusEl = document.getElementById("blowerStatus");
        statusEl.textContent = yState ? "ON" : "OFF";
        statusEl.className =
          "panel-status " + (yState ? "status-on" : "status-off");
        document.getElementById("blowerY").textContent = yState ? "ON" : "OFF";
        document.getElementById("blowerY").style.color = yState
          ? "#4caf50"
          : "#f44336";
        document.getElementById("blowerM7").textContent = m7State
          ? "ON"
          : "OFF";
        document.getElementById("blowerM7").style.color = m7State
          ? "#4caf50"
          : "#f44336";
      }

      function updateVibro(yState, m4State) {
        const statusEl = document.getElementById("vibroStatus");
        statusEl.textContent = yState ? "ON" : "OFF";
        statusEl.className =
          "panel-status " + (yState ? "status-on" : "status-off");
        document.getElementById("vibroY").textContent = yState ? "ON" : "OFF";
        document.getElementById("vibroY").style.color = yState
          ? "#4caf50"
          : "#f44336";
        document.getElementById("vibroM4").textContent = m4State ? "ON" : "OFF";
        document.getElementById("vibroM4").style.color = m4State
          ? "#4caf50"
          : "#f44336";
      }

      function quickSetD1(value) {
        document.getElementById("d1Input").value = value;
        document.getElementById("d1Slider").value = value;
        document.getElementById("d1Display").textContent = value;
        setD1Value();
      }

      async function setD1Value() {
        if (currentMode !== "REMOTE") {
          alert("❌ D1 control only available in REMOTE mode (X1/M1)!");
          return;
        }

        const value = parseInt(document.getElementById("d1Input").value);

        if (isNaN(value) || value < 0 || value > 2000) {
          alert("❌ Please enter a value between 0 and 2000");
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/d/1`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "true"
            },
            body: JSON.stringify({ value: value }),
          });

          const result = await res.json();

          if (result.success) {
            document.getElementById("d1Display").textContent = value;
            console.log(`✅ D1 set to ${value}`);
            setTimeout(loadStatus, 500);
          } else {
            alert("❌ Failed to set D1 value");
          }
        } catch (error) {
          alert("❌ Error: " + error.message);
        }
      }

      async function controlBlower(state) {
        if (currentMode !== "REMOTE") {
          alert(
            `❌ Control only available in REMOTE mode!\nCurrent mode: ${currentMode}`
          );
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/y/0`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "true"
            },
            body: JSON.stringify({ state: state }),
          });
          const result = await res.json();
          if (result.success) setTimeout(loadStatus, 300);
        } catch (error) {
          alert("Error: " + error.message);
        }
      }

      async function controlVibro(state) {
        if (currentMode !== "REMOTE") {
          alert(
            `❌ Control only available in REMOTE mode!\nCurrent mode: ${currentMode}`
          );
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/y/1`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "true"
            },
            body: JSON.stringify({ state: state }),
          });
          const result = await res.json();
          if (result.success) setTimeout(loadStatus, 300);
        } catch (error) {
          alert("Error: " + error.message);
        }
      }
    </script>
  </body>
</html>
